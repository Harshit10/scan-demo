plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version "${spotlessVersion}"
    id 'org.sonarqube' version "${sonarqubeVersion}"
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', springCloudVersion)
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

    // OpenRewrite's MigrateToModularStarters recipe added this (Boot 4.1.0 split RestClient
    // auto-configuration out of spring-boot-starter-web/-webmvc); the recipe pinned its own
    // recollection of the version (4.0.7) rather than reading this project's springBootVersion
    // — aligned to match everything else here.
    implementation "org.springframework.boot:spring-boot-starter-restclient:${springBootVersion}"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"

    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation "io.micrometer:micrometer-tracing:${micrometerTracingVersion}"

    // ---- test scaffolding: DO NOT REMOVE as part of any SCA fix ----
    // DIRECT EDIT (disclosed, not OpenRewrite — no applicable recipe found): Spring Cloud
    // Contract 5.x dropped @AutoConfigureWireMock; wiremock-spring-boot now supplies
    // @EnableWireMock/@ConfigureWireMock, used below to stub the OAuth token endpoint
    // during Spring context startup.
    testImplementation 'org.springframework.cloud:spring-cloud-contract-wiremock'
    testImplementation 'org.wiremock.integrations:wiremock-spring-boot:4.2.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.graphql:spring-graphql-test'
    // DIRECT EDIT (disclosed, not OpenRewrite): testcontainers 2.x renamed this artifact
    // (org.testcontainers:junit-jupiter -> org.testcontainers:testcontainers-junit-jupiter,
    // same Java package). Fixed directly because it blocks :compileTestJava, which
    // rewriteDryRun/rewriteRun themselves depend on — OpenRewrite can't parse the test LST
    // on an unresolvable classpath, so Testcontainers2Migration never gets a chance to run
    // until this one line is unblocked first.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"

    // Added by OpenRewrite's Jakarta EE 10 migration recipe (part of the Spring Boot 4
    // upgrade chain): keeps the old javax.xml.bind API available at runtime for
    // Jackson's XML data-binding support even after the rest of the app moved to
    // jakarta.xml.bind. Not temporary tooling — a real transitive-compatibility need the
    // recipe identified, kept per the Non-Removal Invariant.
    runtimeOnly "javax.xml.bind:jaxb-api:2.3.1"
}

tasks.named('test') {
    useJUnitPlatform()
    filter {
        excludeTestsMatching '*IntegrationTest'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (WireMock + Testcontainers backed).'
    group = 'verification'
    useJUnitPlatform()
    filter {
        includeTestsMatching '*IntegrationTest'
    }
    shouldRunAfter test
}

tasks.named('check') {
    dependsOn integrationTest
}

spotless {
    java {
        googleJavaFormat()
        target 'src/**/*.java'
    }
}

sonarqube {
    properties {
        property 'sonar.projectKey', 'sca-demo'
    }
}
