plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version "${spotlessVersion}"
    id 'org.sonarqube' version "${sonarqubeVersion}"
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', springCloudVersion)
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation "org.springdoc:springdoc-openapi-ui:${springDocVersion}"

    // RestClient (used pre-downgrade) needs Spring Framework 6.1+; Boot 2.7's Spring
    // Framework 5.3 line only has RestTemplate. spring-cloud-starter-sleuth is the Boot
    // 2.7-era tracing stack (micrometer-tracing needs Boot 3's observability API).
    implementation 'org.springframework.cloud:spring-cloud-starter-sleuth'

    testImplementation 'org.springframework.cloud:spring-cloud-contract-wiremock'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.graphql:spring-graphql-test'
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
    filter {
        excludeTestsMatching '*IntegrationTest'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (WireMock + Testcontainers backed).'
    group = 'verification'
    useJUnitPlatform()
    filter {
        includeTestsMatching '*IntegrationTest'
    }
    shouldRunAfter test
}

tasks.named('check') {
    dependsOn integrationTest
}

spotless {
    java {
        googleJavaFormat()
        target 'src/**/*.java'
    }
}

sonarqube {
    properties {
        property 'sonar.projectKey', 'sca-demo'
    }
}
