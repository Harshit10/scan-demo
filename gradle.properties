# --- Versions under SCA test. These are the "before" (vulnerable) pins.
# The remediation agent should bump each of these to the "target" version
# on the right, verify against NVD/OSV, and land a build+test-green commit
# without deleting any of the WireMock/GraphQL test scaffolding below.
#
#   dependency                 before      target
#   springBootVersion          3.5.8    -> 3.5.16
#   springCloudVersion         2025.0.0 -> 2025.1.1
#   springDocVersion           2.8.14   -> 2.8.17
#   micrometerTracingVersion   1.6.0    -> 1.6.5
#   spotlessVersion            6.4.2    -> 6.5.2   (nearest real releases —
#                                                    6.4.5/6.5.4 were never published)
#   sonarqubeVersion           7.1.0.6387 -> 7.3.0.8198
#   testcontainersVersion      2.0.2    -> 2.0.5

springBootVersion=4.1.0
springCloudVersion=2025.1.2
springDocVersion=2.8.14
micrometerTracingVersion=1.6.0
spotlessVersion=6.4.2
sonarqubeVersion=7.1.0.6387
testcontainersVersion=2.0.2
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
org.gradle.jvmargs=-Xmx1536m \
  --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
  --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
  --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
# ^ google-java-format (pulled in by spotless.googleJavaFormat()) reaches into
# jdk.compiler internals; JDK 16+'s strong encapsulation (JEP 403) blocks that
# without these --add-exports/--add-opens flags. Required on JDK 17/21 toolchains.
